    <title>David Owusu | Official Website</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #102542 0%, #0b3c91 50%, #102542 100%);
        color: #fff;
        transition: opacity 0.45s ease;
      }
      html:has(#boot-loader:not(.is-done)) {
        overflow: hidden;
      }
      #boot-loader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader .mark {
        position: relative;
        width: 7rem;
        height: 7rem;
        display: grid;
        place-items: center;
        border-radius: 9999px;
        animation: boot-glow 2.4s ease-in-out infinite;
      }
      #boot-loader .ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1.5px solid rgba(200, 160, 70, 0.22);
        border-top-color: #c8a046;
        border-right-color: #e8c96a;
        animation: boot-spin 1.15s linear infinite;
      }
      #boot-loader .ring-inner {
        inset: 18%;
        border: 1px solid transparent;
        border-bottom-color: #c8a046;
        animation: boot-spin-reverse 1.8s linear infinite;
      }
      #boot-loader .mono {
        font-family: "Playfair Display", ui-serif, Georgia, serif;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: 0.12em;
        color: #c8a046;
        position: relative;
        z-index: 1;
      }
      #boot-loader .name {
        margin: 2rem 0 0;
        font-family: "Playfair Display", ui-serif, Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      #boot-loader .rule {
        display: block;
        width: 4rem;
        height: 1px;
        margin-top: 0.75rem;
        background: rgba(200, 160, 70, 0.8);
      }
      #boot-loader .label {
        margin-top: 1rem;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }
      #boot-loader .bar {
        width: 10rem;
        height: 2px;
        margin-top: 1.5rem;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.15);
      }
      #boot-loader .bar span {
        display: block;
        width: 50%;
        height: 100%;
        border-radius: 9999px;
        background: #c8a046;
        animation: boot-bar 1.35s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-spin-reverse {
        to {
          transform: rotate(-360deg);
        }
      }
      @keyframes boot-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(220%);
        }
      }
      @keyframes boot-glow {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(200, 160, 70, 0.12);
        }
        50% {
          box-shadow: 0 0 32px 6px rgba(200, 160, 70, 0.28);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .mark,
        #boot-loader .ring,
        #boot-loader .ring-inner,
        #boot-loader .bar span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="mark" aria-hidden="true">
        <span class="ring"></span>
        <span class="ring ring-inner"></span>
        <span class="mono">DO</span>
      </div>
      <p class="name">David Owusu</p>
      <span class="rule"></span>
      <p class="label">Loading</p>
      <div class="bar"><span></span></div>
    </div>
    <div id="root"></div>
    <noscript>
      <style>
        #boot-loader {
          display: none !important;
        }
      </style>
      <p style="padding: 2rem; font-family: Poppins, sans-serif; text-align: center">
        JavaScript is required to view this site.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
